packages:
  - apps/*
  - packages/*

# Versions shared across workspace packages. SDK-bound mobile dependencies are pinned in the
# app's package.json by `expo install` instead.
catalog:
  "@types/node": 24.12.4
  # React Native pins React, so the web follows the phone's version.
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # React Compiler, on in both apps: through Babel on the web and through babel-preset-expo on the
  # phone, so one compiler version.
  babel-plugin-react-compiler: 1.0.0
  typescript: 7.0.2
  # The workspace's Vite is Vite+'s core. They move together.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# One copy of each in the workspace. Vite: Vite+'s, so the web's plugins and `vp` see the same
# one. React and Tailwind: the phone and the web on one version, which ranges would let drift.
overrides:
  vite@*: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
  tailwindcss: "catalog:"

peerDependencyRules:
  allowAny:
    - vite

# Packages whose install scripts may run. pnpm fails the install on any other.
allowBuilds:
  # EAS CLI uses the shipped JS; optional native tracing and protobuf regeneration are unused.
  dtrace-provider: false
  protobufjs: false
  esbuild: true
  workerd: true

# A version gets in only a day after it's published, the time npm usually takes to pull one that
# shipped malware. Strict: pnpm refuses a newer one instead of excluding it from the rule.
minimumReleaseAgeStrict: true
