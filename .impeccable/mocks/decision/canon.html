<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#141218;color:#e6e0e9;font-family:Roboto,sans-serif}
.clock{text-align:center;padding-top:52px;font-size:64px;font-weight:400;letter-spacing:-1px}
.sub{text-align:center;color:#cac4d0;font-size:15px;margin-top:2px}
.prog{margin:22px 24px 0;height:8px;border-radius:4px;background:#2b2930}.prog i{display:block;width:40%;height:8px;border-radius:4px;background:#d0bcff}
.pl{margin:8px 24px;font-size:14px;color:#cac4d0}
.card{margin:14px 16px;padding:22px 20px;background:#211f26;border-radius:24px;height:330px}
.q{font-size:22px;line-height:1.35;font-weight:500}.hr{height:1px;background:#49454f;margin:18px 0}
.a{font-size:20px;line-height:1.4;color:#cac4d0}
.grades{position:absolute;left:16px;right:16px;top:640px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{height:60px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;font-size:15px;color:#1d1b20}
.g small{font-size:12px;opacity:.75}
.snooze{position:absolute;left:16px;right:16px;top:766px;height:52px;border-radius:26px;border:1px solid #938f99;display:flex;align-items:center;justify-content:center;color:#d0bcff;font-weight:500}
</style></head><body>
<div class="clock">06:12</div><div class="sub">Anatomia › Membro superior</div>
<div class="prog"><i></i></div><div class="pl">2 de 5 certos</div>
<div class="card"><div class="q">Qual nervo inerva o músculo deltoide?</div><div class="hr"></div>
<div class="a">Nervo axilar (C5–C6), ramo do fascículo posterior do plexo braquial.</div></div>
<div class="grades"><div class="g" style="background:#f2b8b5">De novo<small>&lt;1 min</small></div><div class="g" style="background:#ffd8a8">Difícil<small>6 min</small></div><div class="g" style="background:#b8f2c4">Bom<small>3 dias</small></div><div class="g" style="background:#a8d4ff">Fácil<small>9 dias</small></div></div>
<div class="snooze">Adiar 9 min</div>
</body></html>
