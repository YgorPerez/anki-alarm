<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0d0e0c;color:#efe9d8;font-family:"Atkinson Hyperlegible",sans-serif}
.top{padding:44px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #2a2a25}
.lab{font:600 13px "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;color:#8d8a7d}
.flaps{display:flex;gap:4px;margin-top:6px}
.f{position:relative;width:34px;height:50px;background:#1c1d19;border-radius:3px;font:700 40px/50px "Barlow Condensed";text-align:center;color:#ffd23f}
.f:after{content:"";position:absolute;left:0;right:0;top:24px;height:2px;background:#0d0e0c}
.f.dim{color:#5c5a50}
.f.sm{width:26px;height:38px;font-size:30px;line-height:38px}.f.sm:after{top:18px}
.row{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid #2a2a25;font:600 15px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:#8d8a7d}
.row b{color:#efe9d8;font-weight:600}.row .y{color:#ffd23f}
.card{margin:16px 20px;padding:22px 20px;background:#16170f;border:1px solid #2a2a25;border-radius:6px;height:330px}
.q{font-size:24px;line-height:1.35;font-weight:700}
.hr{height:1px;background:#3a382f;margin:18px 0}
.a{font-size:22px;line-height:1.4;color:#d9d3c0}
.grades{position:absolute;left:20px;right:20px;top:640px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{height:64px;border-radius:6px;background:#1c1d19;border:1px solid #33322b;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 19px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.g small{font:500 13px "Barlow Condensed";color:#8d8a7d;letter-spacing:.04em}
.g.r{color:#ff7a59}.g.ok{background:#ffd23f;color:#0d0e0c;border-color:#ffd23f}.g.ok small{color:#4a3e10}
.snooze{position:absolute;left:20px;right:20px;top:766px;height:52px;border:1px dashed #3a382f;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 16px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:#8d8a7d}
</style></head><body>
<div class="top"><div><div class="lab">Despertador · 06:00</div>
<div class="flaps"><div class="f">0</div><div class="f">6</div><div class="f dim">:</div><div class="f">1</div><div class="f">2</div></div></div>
<div style="text-align:right"><div class="lab">Faltam</div><div class="flaps" style="justify-content:flex-end"><div class="f">3</div></div></div></div>
<div class="row"><span>Baralho</span><b>Anatomia › Membro superior</b><span style="margin-left:auto" class="y">2 de 5 certos</span></div>
<div class="card"><div class="q">Qual nervo inerva o músculo deltoide?</div><div class="hr"></div>
<div class="a">Nervo axilar (C5–C6), ramo do fascículo posterior do plexo braquial.</div></div>
<div class="grades"><div class="g r">De novo<small>&lt;1 min</small></div><div class="g">Difícil<small>6 min</small></div><div class="g ok">Bom<small>3 dias</small></div><div class="g">Fácil<small>9 dias</small></div></div>
<div class="snooze">Adiar 9 min · +2 cartões</div>
</body></html>
