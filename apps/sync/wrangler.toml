# The sync service (docs/adr/0001-sync-protocol.md, docs/adr/0007-better-auth.md). Secrets and the
# D1 database id are the human's to set: see docs/release.md › Sync and sign-in.
name = "app-sync"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# BETTER_AUTH_URL, TRUSTED_ORIGINS, BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
# are Worker secrets (`wrangler secret put`), so a deploy never overwrites them. Locally they go in
# an untracked `.dev.vars`.

[[d1_databases]]
binding = "DB"
database_name = "app-sync"
# Replace with the id `wrangler d1 create app-sync` prints. Local dev and tests ignore it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
