appId: dev.ygorperez.ankialarm
---
# Labels match pt-BR or English: the app follows the device's language, and the CI emulator's is
# English.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Prepare seus alarmes|Prepare your alarms"
    timeout: 30000
# A fresh emulator lacks the essentials, so Finish stays locked: skip, then confirm in the dialog
# (case-insensitive, as Android may draw dialog buttons in capitals).
- runFlow:
    when:
      visible: "Pular por agora|Skip for now"
    commands:
      - tapOn: "Pular por agora|Skip for now"
      - tapOn: "(?i)pular por agora|skip for now"
- runFlow:
    when:
      visible: "Concluir|Finish"
    commands:
      - tapOn: "Concluir|Finish"
- tapOn: "Baralhos|Decks"
- tapOn: "Criar baralho|Create deck"
- tapOn: "Nome do baralho|Deck name"
- inputText: "Maestro"
- hideKeyboard
- tapOn: "Salvar|Save"
- assertVisible: "Maestro"
