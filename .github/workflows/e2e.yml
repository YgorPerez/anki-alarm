# The release APK takes about 18 minutes to build, so this stays out of the pull request checks.
# To run it on a branch: gh workflow run e2e.yml --ref <branch>
name: E2E
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        # The default list includes `tools`, which the SDK no longer ships.
        with:
          packages: platform-tools
      - name: Build standalone test APK
        run: |
          vp exec --filter @app/mobile expo prebuild --clean --platform android --no-install
          cd apps/mobile/android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            # A slow runner can leave the launcher's "isn't responding" dialog over the app.
            adb shell settings put global hide_error_dialogs 1
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            # The runner runs each line on its own, so the logcat dump on failure shares the line.
            mkdir -p maestro-debug && $HOME/.maestro/bin/maestro test apps/mobile/.maestro --debug-output maestro-debug --flatten-debug-output || { adb logcat -d > maestro-debug/logcat.txt; exit 1; }
      # Screenshots, the view hierarchy and logcat of a failed flow.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro
          path: maestro-debug
