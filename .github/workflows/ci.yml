name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - name: Generate phone story imports
        run: vp exec --filter @app/mobile sb-rn-get-stories
      - name: Check, test (including stories), and build affected packages
        run: node scripts/tooling/ci.ts
      - name: Per-file violation ceilings
        run: vp run quality
