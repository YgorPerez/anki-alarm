# The checks and tests, on every push. Releases ship from tags in their own workflow
# (docs/adr/0002-release-policy.md).
name: CI

on:
  push:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, lint (oxlint, @shadcn/lint on the web) and types, the tests, fallow and React Doctor.
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Vite+, the Node.js in package.json's `engines` and the pnpm in `packageManager`, then
      # `vp install` from the lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: vp check
        run: vp check

      - name: vp lint
        run: vp lint

      - name: vp test
        run: vp test run

      - name: Fallow
        run: vp run fallow

      - name: React Doctor
        run: vp run react-doctor

  # The apps build: the web for Workers, and the phone's JS bundle through Metro and uniwind.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Web
        run: vp run --filter @app/web build

      - name: Phone bundle
        run: vp exec --filter @app/mobile expo export --platform android --output-dir "$RUNNER_TEMP/mobile"
