name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      mobile: ${{ steps.plan.outputs.mobile }}
    env:
      CI_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - name: Generate phone story imports
        run: vp exec --filter @app/mobile sb-rn-get-stories
      - name: Select affected packages and Maestro gate
        id: plan
        run: node scripts/tooling/ci.ts --plan
      - name: Check, test (including stories), and build affected packages
        run: node scripts/tooling/ci.ts
      - name: Per-file violation ceilings
        run: vp run quality
  maestro:
    needs: check
    if: needs.check.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build standalone test APK
        run: |
          vp exec --filter @app/mobile expo prebuild --clean --platform android --no-install
          cd apps/mobile/android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            $HOME/.maestro/bin/maestro test apps/mobile/.maestro
